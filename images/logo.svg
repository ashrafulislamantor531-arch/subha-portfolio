  </defs>
  
  <!-- Brush Stroke Mark -->
  <g transform="translate(10, 8)">
    <path d="M4 32 C12 18, 22 8, 34 12 C44 15, 30 38, 20 40 C14 41, 10 37, 4 32 Z" fill="url(#subhaGrad)" opacity="0.85" filter="url(#glow)"/>
