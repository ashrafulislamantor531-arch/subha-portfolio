    <circle cx="36" cy="14" r="3" fill="#38bdf8" />
    <circle cx="16" cy="36" r="2" fill="#f472b6" />
  </g>
  
  <!-- Typography -->
  <text x="65" y="38" font-family="'Plus Jakarta Sans', 'Inter', 'Cinzel', sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#ffffff">
